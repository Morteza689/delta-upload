# Delta Upload. Proxies to gunicorn over a unix socket.
#
#   sudo cp deploy/nginx-dup.conf /etc/nginx/sites-available/dup
#   sudo ln -sf /etc/nginx/sites-available/dup /etc/nginx/sites-enabled/dup
#   sudo nginx -t && sudo systemctl reload nginx
#
# A socket rather than a port: this host already runs another application on
# 127.0.0.1:3000, and a socket cannot collide with anything.

upstream dup_app {
    server unix:/run/dup/dup.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name d-up.yaspardaz.ir;

    # Left open on http so renewal keeps working after the redirect below.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name d-up.yaspardaz.ir;

    ssl_certificate     /etc/letsencrypt/live/d-up.yaspardaz.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d-up.yaspardaz.ir/privkey.pem;

    # Must not be below MAX_UPLOAD_SIZE_BYTES, or nginx rejects the upload
    # before Django can say anything useful about why.
    client_max_body_size 2g;

    # Hand the body to Django as it arrives instead of spooling all of it to
    # disk first. Buffering a 2 GB upload writes 2 GB here and then 2 GB again
    # through Django, on a disk with a few gigabytes free.
    proxy_request_buffering off;

    # A download streamed out of Telegram is slow by nature: it is fetched
    # piece by piece from Telegram and passed on. The default 60s cuts it off
    # mid-file.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Served straight from disk. Names carry a content hash, which is what
    # makes a year-long cache safe.
    location /static/ {
        alias /opt/dup/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://dup_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Downloads are streamed. With buffering on, nginx collects the whole
        # response before sending any of it, so the browser shows nothing for
        # minutes and the progress bar never moves.
        proxy_buffering off;
    }
}
