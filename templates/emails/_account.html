{% comment %}
    Which account this is about, for anyone with more than one address. Takes
    email.

    In an anchor of our own: Gmail and Apple Mail link an address they find
    in the text, in blue and underlined, which here would look like the thing
    to press.
{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"
       style="margin:0 auto 28px auto;">
    <tr>
        <td dir="ltr" bgcolor="#F6F6F3"
            style="background-color:#F6F6F3; border:1px solid #E2E2DD; border-radius:999px;
                   padding:6px 14px; font-size:13px; line-height:18px;">
            <a href="mailto:{{ email }}" style="color:#161618; text-decoration:none;">{{ email }}</a>
        </td>
    </tr>
</table>
