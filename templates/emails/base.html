{% load i18n %}<!doctype html>
{% with start=LANGUAGE_BIDI|yesno:"right,left" dir=LANGUAGE_BIDI|yesno:"rtl,ltr" %}
<html lang="{{ LANGUAGE_CODE }}" dir="{{ dir }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{% block subject %}{{ site_name }}{% endblock %}</title>
</head>
{% comment %}
    Email is not the web. Tables for layout, styles inline on every element,
    no external stylesheet and no web font: Gmail strips <style> from forwarded
    mail, Outlook renders with Word, and neither supports flex or grid.

    No SVG either. Gmail and Outlook drop it without a trace, so the delta mark
    is the Δ character on a brand disc: it is the same shape, and a character
    is something every client draws.

    The card has two zones, because the message has two audiences. The top is
    for the person who asked for this: centred, one heading, one sentence, one
    button, and the one fact that bears on pressing it. The band underneath is
    for when something is off: the button does not work, or they never asked.
    Small and quiet there, so nothing competes with the button.

    The colours are the site's own palette from static/src/input.css, written
    as literal hex because a mail client has no CSS variables:

        paper #FCFCFA   surface #FFFFFF   sunken #F6F6F3
        line  #E2E2DD   ink     #161618   ink-soft #5C5C63
        ink-faint #8A8A92   brand #E03E26

    Light only. The site follows the system theme, but a dark email is a
    coin toss: several clients invert colours themselves and a hand-made dark
    palette then comes back inverted twice.

    600px wide, the widest that survives a phone in portrait.

    Direction follows the reader's language rather than being fixed. Several
    clients ignore dir on <html>, so every block that holds text carries its
    own dir and align.
{% endcomment %}
<body style="margin:0; padding:0; background-color:#F6F6F3;
             font-family:{% if LANGUAGE_BIDI %}Vazirmatn,Tahoma,Arial{% else %}Arial,Helvetica{% endif %},sans-serif; color:#161618;">

<div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
    {% comment %} The preview line an inbox shows beside the subject. Without it the
       client picks the first words it finds, usually the site name. The run of
       invisible characters after it stops the client from padding the preview
       with the start of the body. {% endcomment %}
    {% block preheader %}{% endblock %}
    {% for _ in "123456789012345678901234567890" %}&zwnj;&nbsp;{% endfor %}
</div>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="background-color:#F6F6F3;">
    <tr>
        <td align="center" style="padding:40px 12px;">

            <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                   width="560" style="width:100%; max-width:560px;">
                <tr>
                    <td style="background-color:#FFFFFF; border:1px solid #E2E2DD;
                               border-radius:20px;">
                        <table role="presentation" cellpadding="0" cellspacing="0"
                               border="0" width="100%">
                            <tr>
                                <td dir="{{ dir }}" align="center"
                                    style="padding:40px 32px 36px 32px; text-align:center;">

                                    <a href="{{ site_url }}" style="text-decoration:none;">
                                        <table role="presentation" cellpadding="0" cellspacing="0"
                                               border="0" align="center" style="margin:0 auto 24px auto;">
                                            <tr>
                                                <td width="52" height="52" align="center" valign="middle"
                                                    bgcolor="#E03E26"
                                                    style="width:52px; height:52px; border-radius:16px;
                                                           background-color:#E03E26;
                                                           font-family:Arial,Helvetica,sans-serif;
                                                           font-size:26px; line-height:52px;
                                                           font-weight:bold; color:#FFFFFF;">&#916;</td>
                                            </tr>
                                        </table>
                                    </a>

                                    {% block content %}{% endblock %}

                                </td>
                            </tr>
                            <tr>
                                <td dir="{{ dir }}" align="{{ start }}" bgcolor="#FAFAF8"
                                    style="background-color:#FAFAF8; border-top:1px solid #EDEDE9;
                                           border-radius:0 0 19px 19px; padding:24px 32px 28px 32px;
                                           text-align:{{ start }}; font-size:12px; line-height:20px;
                                           color:#8A8A92;">

                                    {% block details %}{% endblock %}

                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td dir="{{ dir }}" align="center"
                        style="padding:24px 16px 0 16px; text-align:center;
                               font-size:12px; line-height:20px; color:#8A8A92;">
                        {% block footer %}
                            {% if replies_reach_support %}
                                <p style="margin:0 0 6px 0; font-size:13px; line-height:22px; color:#5C5C63;">
                                    {% translate "سؤالی داری؟ به همین ایمیل جواب بده تا به پشتیبانی برسد." %}
                                </p>
                            {% endif %}
                            <p style="margin:0;">
                                {% blocktranslate %}این ایمیل از طرف {{ site_name }} فرستاده شده است.{% endblocktranslate %}
                                <a href="{{ site_url }}" dir="ltr"
                                   style="color:#5C5C63; text-decoration:none;">{{ site_host }}</a>
                            </p>
                        {% endblock %}
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>
</body>
</html>
{% endwith %}
