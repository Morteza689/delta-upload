{% load i18n %}
{% comment %}
Theme switch, three states: follow the system, then light, then dark.

CSS picks the active icon rather than JavaScript, so it is right on the first
render and does not change once the script loads.
{% endcomment %}
<button type="button" data-theme-toggle
        class="flex h-10 w-10 items-center justify-center rounded-lg border hairline
               transition-colors hover:bg-[rgb(var(--sunken))] sm:h-9 sm:w-9"
        aria-label="{% translate 'تغییر تم' %}"
        title="{% translate 'تغییر تم' %}">

    {# System #}
    <svg data-theme-icon="system" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" class="h-[18px] w-[18px]" aria-hidden="true">
        <rect x="2" y="4" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 18v3"/>
    </svg>

    {# Light #}
    <svg data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" class="h-[18px] w-[18px]" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>

    {# Dark #}
    <svg data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" class="h-[18px] w-[18px]" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
</button>
