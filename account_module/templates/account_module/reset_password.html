{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% translate "تعیین رمز عبور جدید" %}{% endblock %}

{% block body %}
    <div class="mx-auto max-w-md">
        <div class="panel">
            <div class="panel-body">
                <h1 class="mb-5 text-lg font-bold sm:mb-6 sm:text-xl">{% translate "تعیین رمز عبور جدید" %}</h1>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% with form=reset_password_form %}
                        {% include 'shared/form_fields.html' %}
                    {% endwith %}

                    <button type="submit" class="btn-primary w-full">{% translate "ذخیره" %}</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
